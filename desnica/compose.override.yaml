services:
  caddy:
    profiles: [standalone-caddy]

  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  cms:
    image: desnica-cms:server-proxy
    build:
      args:
        PUBLIC_URL: ${PUBLIC_URL:-https://cms.anorc.ru}
    ports: !override
      - "127.0.0.1:${CMS_PORT:-1337}:1337"
