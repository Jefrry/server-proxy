name: server-proxy

services:
  caddy:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    network_mode: host
    environment:
      DESNICA_WEB_PORT: ${DESNICA_WEB_PORT:-3000}
      DESNICA_CMS_PORT: ${DESNICA_CMS_PORT:-1337}
      JEFRRY_HTTP_PORT: ${JEFRRY_HTTP_PORT:-8080}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
